<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JOE → Spotify">
<meta name="theme-color" content="#121212">
<title>JOE naar Spotify</title>
<style>
  :root { --bg:#121212; --card:#1e1e1e; --text:#f2f2f2; --muted:#a7a7a7; --green:#1ed760; --red:#ff6b6b; --line:#2e2e2e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         padding:max(24px, env(safe-area-inset-top)) 16px 40px; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:26px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border-radius:16px; padding:20px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:0 0 6px; }
  input[type=text], input[type=date], input[type=password] { width:100%; font-size:18px; padding:14px; border-radius:10px;
         border:1px solid var(--line); background:#111; color:var(--text); margin-bottom:16px; -webkit-appearance:none; }
  .check { display:flex; align-items:center; gap:10px; font-weight:400; margin-bottom:12px; }
  .check input { width:22px; height:22px; accent-color:var(--green); }
  button, .btn { display:block; width:100%; text-align:center; font-size:19px; font-weight:700; padding:16px; border:0;
         border-radius:999px; background:var(--green); color:#000; text-decoration:none; cursor:pointer; margin-top:8px; }
  button.secondary, .btn.secondary { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:600; }
  button:disabled { opacity:.6; }
  .muted { color:var(--muted); font-size:15px; }
  .error { color:var(--red); font-weight:600; }
  ul.tracks { list-style:none; padding:0; margin:0; }
  ul.tracks li { padding:10px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
  ul.tracks li span.s { color:var(--muted); font-size:14px; white-space:nowrap; }
  ul.tracks li.miss span.s { color:var(--red); }
  details { margin-top:12px; } pre { white-space:pre-wrap; font-size:13px; color:var(--muted); }
  form.inline { margin:0; }
</style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
